[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
cache_path = "cache"
broadcast = "broadcast"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Compiler settings
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test settings
verbosity = 2
fuzz_runs = 1000
fuzz_max_test_rejects = 65536

# RPC settings (optional, only needed for deployment)
# eth_rpc_url = "${ETHEREUM_MAINNET_RPC_URL}"
# avalanche_rpc_url = "${AVALANCHE_MAINNET_RPC_URL}"
# avalanche_fuji_rpc_url = "${AVALANCHE_FUJI_RPC_URL}"

# Etherscan settings (optional, only needed for verification)
# etherscan_api_key = "${ETHERSCAN_API_KEY}"

# Gas settings
gas_limit = 9223372036854775807
gas_price = 20000000000

# Additional settings
auto_detect_solc = false
offline = false
allow_paths = []

# Network configurations
[rpc_endpoints]
mainnet = "${ETHEREUM_MAINNET_RPC_URL}"
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
avalanche = "${AVALANCHE_MAINNET_RPC_URL}"
avalanche-fuji = "${AVALANCHE_FUJI_RPC_URL}"
polygon = "${POLYGON_MAINNET_RPC_URL}"
polygon-mumbai = "${POLYGON_MUMBAI_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
avalanche = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }
avalanche-fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
polygon-mumbai = { key = "${POLYGONSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
